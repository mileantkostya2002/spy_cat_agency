openapi: 3.0.3
info:
  title: Spy Cats Service API
  version: 1.0.0
  description: Managment spy missions
paths:
  /api/breed/:
    get:
      operationId: breed_list
      tags:
      - breed
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Breed'
          description: ''
    post:
      operationId: breed_create
      tags:
      - breed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Breed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Breed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Breed'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breed'
          description: ''
  /api/breed/{id}/:
    get:
      operationId: breed_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this breed.
        required: true
      tags:
      - breed
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breed'
          description: ''
    put:
      operationId: breed_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this breed.
        required: true
      tags:
      - breed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Breed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Breed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Breed'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breed'
          description: ''
    patch:
      operationId: breed_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this breed.
        required: true
      tags:
      - breed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBreed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBreed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBreed'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breed'
          description: ''
    delete:
      operationId: breed_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this breed.
        required: true
      tags:
      - breed
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cats/:
    get:
      operationId: cats_list
      tags:
      - cats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpyCatList'
          description: ''
    post:
      operationId: cats_create
      tags:
      - cats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpyCat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpyCat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpyCat'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpyCat'
          description: ''
  /api/cats/{id}/:
    get:
      operationId: cats_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this spy cat.
        required: true
      tags:
      - cats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpyCat'
          description: ''
    put:
      operationId: cats_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this spy cat.
        required: true
      tags:
      - cats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpyCatUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpyCatUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpyCatUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpyCatUpdate'
          description: ''
    patch:
      operationId: cats_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this spy cat.
        required: true
      tags:
      - cats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSpyCatUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSpyCatUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSpyCatUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpyCatUpdate'
          description: ''
    delete:
      operationId: cats_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this spy cat.
        required: true
      tags:
      - cats
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/missions/:
    get:
      operationId: missions_list
      tags:
      - missions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissionList'
          description: ''
    post:
      operationId: missions_create
      tags:
      - missions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MissionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MissionCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionCreate'
          description: ''
  /api/missions/{id}/:
    get:
      operationId: missions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this mission.
        required: true
      tags:
      - missions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetailSerialize'
          description: ''
    put:
      operationId: missions_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this mission.
        required: true
      tags:
      - missions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mission'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Mission'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Mission'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
          description: ''
    patch:
      operationId: missions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this mission.
        required: true
      tags:
      - missions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMissionUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMissionUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMissionUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionUpdate'
          description: ''
    delete:
      operationId: missions_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this mission.
        required: true
      tags:
      - missions
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/targets/:
    get:
      operationId: targets_list
      tags:
      - targets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TargetUpdate'
          description: ''
    post:
      operationId: targets_create
      tags:
      - targets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TargetUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TargetUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetUpdate'
          description: ''
  /api/targets/{id}/:
    get:
      operationId: targets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this target.
        required: true
      tags:
      - targets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetUpdate'
          description: ''
    put:
      operationId: targets_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this target.
        required: true
      tags:
      - targets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TargetUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TargetUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetUpdate'
          description: ''
    patch:
      operationId: targets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this target.
        required: true
      tags:
      - targets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTargetUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTargetUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTargetUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetUpdate'
          description: ''
    delete:
      operationId: targets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this target.
        required: true
      tags:
      - targets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/user/me/:
    get:
      operationId: user_me_retrieve
      tags:
      - user
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: user_me_update
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: user_me_partial_update
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/user/register/:
    post:
      operationId: user_register_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/user/token/:
    post:
      operationId: user_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/user/token/refresh/:
    post:
      operationId: user_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/user/token/verify/:
    post:
      operationId: user_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
components:
  schemas:
    Breed:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
      required:
      - id
      - name
    Mission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cat:
          type: integer
        target:
          type: integer
        is_complete:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cat
      - created_at
      - id
      - is_complete
      - target
      - updated_at
    MissionCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cat:
          type: integer
        target:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cat
      - created_at
      - id
      - target
    MissionDetailSerialize:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cat:
          $ref: '#/components/schemas/SpyCatMission'
        target:
          $ref: '#/components/schemas/Target'
        is_complete:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cat
      - created_at
      - id
      - target
      - updated_at
    MissionList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cat:
          $ref: '#/components/schemas/SpyCatMission'
        target:
          $ref: '#/components/schemas/Target'
        is_complete:
          type: boolean
      required:
      - cat
      - id
      - target
    MissionUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cat:
          type: integer
        target:
          type: integer
        is_complete:
          type: boolean
      required:
      - cat
      - id
      - target
    PatchedBreed:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
    PatchedMissionUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cat:
          type: integer
        target:
          type: integer
        is_complete:
          type: boolean
    PatchedSpyCatUpdate:
      type: object
      properties:
        salary:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
    PatchedTargetUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        notes:
          type: string
        country:
          type: string
          maxLength: 100
        is_complete:
          type: boolean
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 5
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
    SpyCat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        years_of_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        breed:
          type: integer
        salary:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - breed
      - created_at
      - id
      - name
      - salary
      - updated_at
      - years_of_experience
    SpyCatList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        years_of_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        breed:
          type: string
          writeOnly: true
        salary:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
      required:
      - breed
      - id
      - name
      - salary
      - years_of_experience
    SpyCatMission:
      type: object
      properties:
        name:
          type: string
        breed:
          type: integer
      required:
      - breed
      - name
    SpyCatUpdate:
      type: object
      properties:
        salary:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
      required:
      - salary
    Target:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        notes:
          type: string
        is_complete:
          type: boolean
      required:
      - country
      - id
      - name
    TargetUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        notes:
          type: string
        country:
          type: string
          maxLength: 100
        is_complete:
          type: boolean
      required:
      - country
      - name
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 5
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
      required:
      - email
      - id
      - is_staff
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
